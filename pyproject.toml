[project]
name = "autochat"
version = "0.1.0"
description = "POC automotive review chatbot: LangGraph + Cosmos DB (vNext emulator) + FastAPI + Streamlit + Microsoft Foundry"
requires-python = ">=3.11"
dependencies = [
    # orchestration / LLM
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-azure-ai>=1.0",
    "langchain-azure-cosmosdb>=1.0",
    "openai>=2.0",
    # data
    "azure-cosmos>=4.9",
    "aiohttp>=3.9",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "selectolax>=0.3.27",
    "trafilatura>=2.0",          # generic main-content fallback for non-auto.co.il URLs
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    # api / ui
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "streamlit>=1.40",
    # observability / evaluation (local tracking server + GenAI evaluate)
    "mlflow>=3.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autochat"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# dev/diagnostic CLIs: long docstring usage lines and blocking I/O in async CLIs are fine
".github/skills/**/scripts/*.py" = ["E501", "ASYNC240", "ASYNC250"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
